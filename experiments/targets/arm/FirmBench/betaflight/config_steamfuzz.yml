board:
  init_nsvtor: 0x8000000

interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: false
    interval: 1000

memory_maps:
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ram
    address: 0x20000000
    size: 0x100000
    type: ram
  - name: isr_vector
    address: 0x8000000
    size: 0x400 # should be 0x20c but no supported
    file:
      path: betaflight.bin
      length: 0x20c
      # offset: 0x1000
    type: rom
  - name: config
    address: 0x08004000
    size: 0x2000
    type: ram
  - name: text
    address: 0x8008000
    size: 0x82400 # 0x70aa9
    file:
      path: betaflight.bin
      seek: 0x8000
    type: rom
  - name: boot
    address: 0x1fff0000
    size: 0x10000
    type: ram

exit_hooks:
  - name: __NVIC_SystemReset.lto_priv.0.lto_priv.0
    symbol: __NVIC_SystemReset.lto_priv.0.lto_priv.0

mmio_models:
  - context:
      mmio: 0x5000001c
    model:
      bit-extract:
        mask: 0xFFFFFFF3
        left_shift: 0
        bits: 32
  - context:
      mmio: 0x50000020
    model:
      bit-extract:
        mask: 0xFFFFFFF3
        left_shift: 0
        bits: 32
  - context:
      mmio: 0x50000818
    model:
      bit-extract:
        mask: 0x000F000F
        left_shift: 0
        bits: 32
  - context:
      mmio: 0x40023c0c
    model:
      bit-extract:
        mask: 0x1
        left_shift: 0
        bits: 8

symbols:
  - betaflight.elf

script: |
  pub fn main(api) {
    api.on_init(on_init);
  }

  fn on_init() {
    memory::write_u32(0x1fffc010, 0x55555555)?; // magic values

  }


