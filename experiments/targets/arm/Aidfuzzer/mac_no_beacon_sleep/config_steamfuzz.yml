interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: false
    interval: 1000

memory_maps:
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ITM_DWT_BPU
    address: 0xe0000000
    size: 0x3000
    type: mmio
  - name: CTI
    address: 0xe0042000
    size: 0x1000
    type: mmio
  - name: ram
    address: 0x20000000
    permission:
      executable: true
    size: 0x100000
    type: ram
  - name: text
    address: 0x0
    permission:
      executable: true
    size: 0x18000
    file:
      path: mac_no_beacon_sleep_flash.bin
    type: ram

symbols:
  - mac_no_beacon_sleep_flash.elf
