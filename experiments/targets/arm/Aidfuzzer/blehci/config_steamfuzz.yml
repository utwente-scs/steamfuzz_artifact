board:
  init_nsvtor: 0xc000

interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: false
    interval: 1000

memory_maps:
  - name: dynamically_added_crash_region_00000000
    address: 0x0
    size: 0xa000
    type: ram
  - name: dynamically_added_crash_region_10000130
    address: 0xfffb000
    size: 0xa000
    type: ram
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ITM_DWT_BPU
    address: 0xe0000000
    size: 0x3000
    type: mmio
  - name: CTI
    address: 0xe0042000
    size: 0x1000
    type: mmio
  - name: ram
    address: 0x20000000
    size: 0x100000
    type: ram
  - name: text
    address: 0xc000
    size: 0x1c800
    file:
      path: blehci_rh_pateched.bin
    type: rom

symbols:
  - blehci_rh_pateched.elf

script: |
  pub fn main(api) {
    api.on_init(on_init);
  }

  fn on_init() {
    // NOTE: QEMU does not support `init_nsvtor: 0xc020`
    // load at `0xc000` and move (copy) everything by 0x20
    for i in 0x20..=0xc500 {
      let value = memory::read_u8(0xc000 + 0xc500 - i)?;
      memory::write_u8(0xc000 + 0x20 + 0xc500 - i, value)?;
    }
  }
