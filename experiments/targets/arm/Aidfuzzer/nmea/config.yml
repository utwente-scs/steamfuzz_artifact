board:
  init_nsvtor: 0x8000000

interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: true
    interval: 1000

memory_maps:
  - name: irq_ret
    address: 0xffffa000
    size: 0xa000
    permission:
      executable: true
    type: ram
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ITM_DWT_BPU
    address: 0xe0000000
    size: 0x3000
    type: mmio
  - name: CTI
    address: 0xe0042000
    size: 0x1000
    type: mmio
  - name: ram
    address: 0x20000000
    size: 0x100000
    type: ram
  - name: text
    address: 0x8000000
    size: 0x2c400
    file:
      path: rtthread.bin
    type: rom

symbols:
  - rtthread.elf
