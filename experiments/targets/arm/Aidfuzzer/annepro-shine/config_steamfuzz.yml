board:
  init_nsvtor: 0x4000

interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: false
    interval: 1000

memory_maps:
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ITM_DWT_BPU
    address: 0xe0000000
    size: 0x3000
    type: mmio
  - name: CTI
    address: 0xe0042000
    size: 0x1000
    type: mmio
  - name: ram
    address: 0x20000000
    size: 0x100000
    type: ram
  - name: text
    address: 0x4000
    size: 0x13c00
    file:
      path: annepro2-shine-C15.bin
    type: rom

symbols:
  - annepro2-shine-C15.elf
